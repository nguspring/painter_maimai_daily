[project]
name = "painter-maimai-daily"
version = "4.0.1"
description = "画家麦麦的日常：多模型生图、原生 NovelAI、内置日程、日程注入与多渠道自拍"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "maibot-plugin-sdk>=2.15.0,<3",
    "requests>=2.28.0",
    "Pillow>=10",
    "pydantic>=2,<3",
    "tomlkit>=0.12",
    "tzdata>=2024.1",
    "httpx>=0.24,<1",
]

[project.optional-dependencies]
doubao = ["volcengine-python-sdk[ark]"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
